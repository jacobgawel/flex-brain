info:
  name: Index Exercises
  type: http
  seq: 3
  tags:
    - exercises

http:
  method: PUT
  url: "{{baseUrl}}/exercises"
  body:
    type: file
    data:
      - filePath: E:\Projects\Flex\repdb-bundle-standard\exercises.json
        contentType: application/json; charset=utf-8
        selected: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PUT /exercises

  Indexes an exercise catalog for semantic search. The request body is the
  raw RepDB bundle `exercises.json`, posted verbatim — the miniature inline
  bundle here is just a smoke test. The real workflow is:

      curl -X PUT http://127.0.0.1:8000/exercises \
        -H "Content-Type: application/json" \
        --data-binary @exercises.json

  Each non-placeholder exercise is rendered to a text (name + synonyms,
  attribute sentences using display names, description), embedded with the
  RETRIEVAL_DOCUMENT task type, and upserted into the dedicated exercises
  collection with a structured payload (slug, category, equipment,
  difficulty, body_part, muscles, goals, booleans).

  Idempotent: point ids derive from the slug, so re-PUTting a bundle
  overwrites each exercise in place, and points whose slug is missing from
  the bundle are deleted afterwards (`deleted` in the response).

  Errors: an exercise referencing a muscle/equipment slug absent from the
  bundle's lookup dicts returns 400 before any embedding happens.
