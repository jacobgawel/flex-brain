[project]
name = "flex-brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakub Gawel", email = "jakubgawel@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.17.0",
    "magika>=1.0.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "qdrant-client>=1.19.0",
]

[project.scripts]
flex-brain = "flex_brain.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
